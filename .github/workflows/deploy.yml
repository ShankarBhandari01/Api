name: Deploy to VPS

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no shankar@82.25.101.68 << 'EOF'
            set -e
            cd /home/shankar/Api

            echo "Pulling latest code..."
            git pull origin master

            echo "Installing dependencies..."
            # Try clean install first
            if ! npm ci --omit=dev; then
              echo "npm ci failed, lock file mismatch? Falling back to npm install..."
              npm install --omit=dev || exit 1
            fi

            echo "Restarting API service..."
            sudo systemctl restart my-api

            echo "Deployment complete."
          EOF
