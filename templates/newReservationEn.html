<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Reservation Alert</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      padding: 25px 30px;
      border-left: 6px solid #3498db;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    h2 {
      margin: 0 0 15px 0;
      color: #3498db;
    }
    .message {
      font-size: 16px;
      line-height: 1.6;
    }
    .details {
      margin-top: 20px;
      font-size: 15px;
      color: #555;
    }
    .details p {
      margin: 6px 0;
    }
    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>New Reservation Notification</h2>

    <div class="message">
      You have received a new reservation request.<br />
      Please review and accept it as soon as possible.
    </div>

    <div class="footer">
      This is an automated notification from Restaurant 14 Peaks.
    </div>
  </div>
</body>
</html>
